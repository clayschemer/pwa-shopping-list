<h2 mat-dialog-title>{{ 'inactivityReminder.title' | transloco }}</h2>
<mat-dialog-content>
  {{ 'inactivityReminder.message' | transloco }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="'continue'">
    {{ 'inactivityReminder.keepShopping' | transloco }}
  </button>
  <button mat-button color="warn" [mat-dialog-close]="'discard'">
    {{ 'inactivityReminder.discard' | transloco }}
  </button>
  <button mat-button color="primary" [mat-dialog-close]="'close'">
    {{ 'inactivityReminder.close' | transloco }}
  </button>
</mat-dialog-actions>
