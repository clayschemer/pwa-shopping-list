<div class="app-access-denied">
  <h1 class="app-access-denied__title">Access denied</h1>
  <p class="app-access-denied__message">
    The account
    @if (userEmail(); as user) {
      <strong>{{ user.email }}</strong>
    }
    does not have permission to use this application.
  </p>
  <button
    mat-stroked-button
    class="app-access-denied__action"
    (click)="tryDifferentAccount()"
  >
    Try a different account
  </button>
</div>
