<div class="access-denied">
  <mat-icon class="access-denied__icon" aria-hidden="true">lock</mat-icon>
  <h1 class="access-denied__title">Access Denied</h1>
  <p class="access-denied__message">
    Your account is not authorised to access this app.
    Please contact the account owner.
  </p>
  <button
    mat-raised-button
    (click)="signOut()"
    aria-label="Sign out"
  >
    <mat-icon aria-hidden="true">logout</mat-icon>
    Sign out
  </button>
</div>
