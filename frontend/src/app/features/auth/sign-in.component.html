<div class="sign-in">
  <h1 class="sign-in__title">Shopping List</h1>
  <p class="sign-in__subtitle">Sign in to access your shared list</p>
  <button
    mat-raised-button
    class="sign-in__button"
    (click)="signIn()"
    aria-label="Sign in with Google"
  >
    <mat-icon aria-hidden="true">login</mat-icon>
    Sign in with Google
  </button>
</div>
