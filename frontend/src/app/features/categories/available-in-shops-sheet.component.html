<div class="app-available-in-shops-sheet">
  <header class="app-available-in-shops-sheet__header">
    <h3 class="app-available-in-shops-sheet__title">
      {{ 'availableInShops.title' | transloco }}
    </h3>
    <p class="app-available-in-shops-sheet__subtitle">
      {{ 'availableInShops.subtitle' | transloco: { name: data.categoryName } }}
    </p>
  </header>

  @if (rows().length === 0) {
    <p class="app-available-in-shops-sheet__empty">
      {{ 'availableInShops.empty' | transloco }}
    </p>
  } @else {
    <ul class="app-available-in-shops-sheet__list" role="list">
      @for (row of rows(); track row.id) {
        <li class="app-available-in-shops-sheet__row">
          <mat-checkbox
            [checked]="row.includes"
            (change)="toggle(row.id, $event.checked)"
          >
            {{ row.name }}
          </mat-checkbox>
        </li>
      }
    </ul>
  }

  <div class="app-available-in-shops-sheet__actions">
    <button mat-flat-button color="primary" (click)="onDone()">
      {{ 'availableInShops.done' | transloco }}
    </button>
  </div>
</div>
