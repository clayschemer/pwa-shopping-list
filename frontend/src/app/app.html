<mat-sidenav-container class="app-shell" [hasBackdrop]="true">

  <!-- Nav Drawer -->
  <mat-sidenav
    #drawer
    mode="over"
    position="start"
    [attr.aria-label]="'Navigation drawer'"
  >
    <app-nav-drawer (close)="drawer.close()" />
  </mat-sidenav>

  <!-- Main content area -->
  <mat-sidenav-content>

    <!-- Top bar -->
    <header class="top-bar" [class.top-bar--shop]="isShopMode()">
      @if (isPlanMode()) {
        <button
          mat-icon-button
          aria-label="Open navigation menu"
          (click)="drawer.open()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      } @else {
        <!-- Undo button with badge in shop mode -->
        <button
          mat-icon-button
          aria-label="View checked items"
        >
          <mat-icon>undo</mat-icon>
        </button>
      }

      <!-- Mode toggle (centred) -->
      @if (isAuthenticated()) {
        <div class="top-bar__mode-toggle">
          <button
            class="top-bar__mode-btn"
            [class.top-bar__mode-btn--active]="isPlanMode()"
            (click)="switchToPlan()"
            aria-label="Switch to plan mode"
          >
            Plan
          </button>
          <button
            class="top-bar__mode-btn"
            [class.top-bar__mode-btn--active]="isShopMode()"
            (click)="switchToShop()"
            aria-label="Switch to shop mode"
          >
            Shop
          </button>
        </div>
      }

      @if (isPlanMode()) {
        <a
          mat-icon-button
          routerLink="/settings"
          aria-label="Settings"
        >
          <mat-icon>settings</mat-icon>
        </a>
      } @else {
        <!-- Session pill placeholder -->
        <div class="top-bar__session-pill" aria-label="Active session">
          {{ sessionShopName() }}
        </div>
      }
    </header>

    <!-- Routed page content -->
    <router-outlet />

  </mat-sidenav-content>

</mat-sidenav-container>
