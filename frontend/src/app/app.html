@if (isAuthenticated()) {
  @if (showShopBanner()) {
    <app-shop-banner
      [shops]="shops()"
      [selectedShopId]="shopId()"
      [isShopMode]="isShopMode()"
      (shopSelected)="onShopBannerShopSelected($event)"
      (changeRequested)="onShopBannerChangeRequested()"
    />
  }
  @if (isFullScreenRoute()) {
    <main
      class="app-root__fullscreen"
      [class.app-root__fullscreen--with-banner]="showShopBanner()"
    >
      <router-outlet />
    </main>
  } @else {
    <mat-sidenav-container class="app-root__sidenav-container">
      <mat-sidenav [opened]="navDrawerOpen()" mode="over" (closed)="onDrawerClosed()">
        <app-nav-drawer
          (viewCategories)="onViewCategories()"
          (manageShops)="onManageShops()"
          (viewHistory)="onViewHistory()"
          (viewSettings)="onViewSettings()"
        />
      </mat-sidenav>

      <mat-sidenav-content>
        <header class="app-root__top-bar" [class.app-root__top-bar--shop]="isShopMode()">
          @if (isPlanMode()) {
            <button
              mat-icon-button
              class="app-root__menu-btn"
              [attr.aria-label]="'nav.openMenu' | transloco"
              (click)="openDrawer()"
            >
              <mat-icon>menu</mat-icon>
            </button>
          } @else {
            <button
              mat-icon-button
              class="app-root__undo-btn"
              [attr.aria-label]="'nav.viewChecked' | transloco"
              (click)="onOpenUndoHistory()"
            >
              <mat-icon
                [matBadge]="checkedCount() > 0 ? checkedCount() : null"
                matBadgeSize="small"
                matBadgeColor="primary"
                >undo</mat-icon
              >
            </button>
          }

          <nav class="app-root__mode-toggle" aria-label="Mode selection">
            <button
              class="app-root__mode-btn"
              [class.app-root__mode-btn--active]="isPlanMode()"
              (click)="switchToPlan()"
              [attr.aria-current]="isPlanMode() ? 'page' : null"
            >
              {{ 'app.plan' | transloco }}
            </button>
            <button
              class="app-root__mode-btn"
              [class.app-root__mode-btn--active]="isShopMode()"
              (click)="switchToShop()"
              [attr.aria-current]="isShopMode() ? 'page' : null"
            >
              {{ 'app.shop' | transloco }}
            </button>
          </nav>

          @if (isPlanMode()) {
            <button
              mat-icon-button
              type="button"
              class="app-root__filter-btn"
              [attr.aria-label]="'nav.openFilters' | transloco"
              (click)="openPlanFilters()"
            >
              <mat-icon>tune</mat-icon>
            </button>
          } @else {
            <button
              type="button"
              class="app-root__session-pill"
              [attr.aria-label]="'nav.activeSession' | transloco"
              (click)="onSessionPillClicked()"
            >
              <span class="app-root__session-pill-total">
                {{ sessionTotal() | money }}
              </span>
              <mat-icon>shopping_cart_checkout</mat-icon>
            </button>
          }
        </header>

        <main class="app-root__content">
          <router-outlet />
        </main>
      </mat-sidenav-content>
    </mat-sidenav-container>
  }
} @else if (isAuthChecking()) {
  <div class="app-root__loading" role="status" [attr.aria-label]="'app.loading' | transloco">
    <mat-spinner diameter="48" />
  </div>
} @else {
  <router-outlet />
}
