<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shopping List</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#b23000" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link
      rel="preload"
      href="fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Fonts are self-hosted under public/fonts/ rather than fetched from Google's CDN:
      it keeps two third-party origins off the critical path and lets the service worker
      prefetch them (see ngsw-config.json), so typography survives offline.
      Declared here rather than in styles.scss because beasties defers that stylesheet —
      inlining keeps font discovery on the first frame. URLs are relative so they resolve
      against <base href>, which the GH Pages build rewrites to /pwa-shopping-list/.
    -->
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(fonts/plus-jakarta-sans-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url(fonts/plus-jakarta-sans-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'DM Serif Display';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(fonts/dm-serif-display-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'DM Serif Display';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(fonts/dm-serif-display-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      /*
        `block`, not `swap`: these glyphs are keyed by ligature name, so a fallback face
        renders the literal words "menu" / "undo" instead of icons. Self-hosted and
        SW-prefetched, the block period is imperceptible after the first load.
      */
      @font-face {
        font-family: 'Material Icons';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(fonts/material-icons.woff2) format('woff2');
      }

      .material-icons {
        font-family: 'Material Icons';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
    </style>

    <!--
      First-frame placeholder. Self-contained on purpose: this paints before styles.css
      loads and before ThemeService applies any class, so it cannot use --mat-sys-* or
      --app-* custom properties. The literal values below are copied from
      styles/_theme-colors.scss and styles/_theme-base.scss; geometry mirrors
      shell/app-shell-skeleton so the hand-off is invisible.
      Compact mode is not reflected here — it is a localStorage setting applied after
      bootstrap, and the resulting shift is a few pixels at most.
    -->
    <style>
      .app-splash {
        --splash-surface: #fff8f5;
        --splash-group: #ffeadc;
        --splash-row: #ffffff;
        --splash-placeholder: #f4ded0;
        --splash-banner: #bdefbe;
        --splash-card: #fae4d5;
        --splash-track: #f4ded0;
        --splash-accent: #b02f00;
        --splash-muted: #5a413a;

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        background: var(--splash-surface);
        opacity: 1;
      }

      @media (prefers-color-scheme: dark) {
        .app-splash {
          --splash-surface: #1b1109;
          --splash-group: #291d14;
          --splash-row: #160c05;
          --splash-placeholder: #3f3228;
          --splash-banner: #23502c;
          --splash-card: #34281e;
          --splash-track: #3f3228;
          --splash-accent: #ffb5a0;
          --splash-muted: #ffdbd1;
        }
      }

      /* An explicit in-app override beats the OS preference, matching ThemeService. */
      :root.theme-light .app-splash {
        --splash-surface: #fff8f5;
        --splash-group: #ffeadc;
        --splash-row: #ffffff;
        --splash-placeholder: #f4ded0;
        --splash-banner: #bdefbe;
        --splash-card: #fae4d5;
        --splash-track: #f4ded0;
        --splash-accent: #b02f00;
        --splash-muted: #5a413a;
      }

      :root.theme-dark .app-splash {
        --splash-surface: #1b1109;
        --splash-group: #291d14;
        --splash-row: #160c05;
        --splash-placeholder: #3f3228;
        --splash-banner: #23502c;
        --splash-card: #34281e;
        --splash-track: #3f3228;
        --splash-accent: #ffb5a0;
        --splash-muted: #ffdbd1;
      }

      .app-splash--out {
        opacity: 0;
        transition: opacity 160ms cubic-bezier(0.4, 0, 1, 1);
      }

      .app-splash__banner {
        height: 1.5rem;
        background: var(--splash-banner);
      }

      .app-splash__top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        min-height: 4.25rem;
        padding: 0.75rem 1rem;
      }

      .app-splash__icon,
      .app-splash__toggle,
      .app-splash__title,
      .app-splash__name,
      .app-splash__qty {
        background: var(--splash-placeholder);
        border-radius: 0.25rem;
      }

      .app-splash__icon {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999rem;
      }

      .app-splash__toggle {
        width: 9rem;
        height: 2.25rem;
        border-radius: 999rem;
      }

      .app-splash__content {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
      }

      .app-splash__group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding: 0 0.25rem 0.25rem;
        border-radius: 0.5rem;
        background: var(--splash-group);
      }

      .app-splash__header {
        padding: 0.75rem 0.75rem 0.5rem;
      }

      .app-splash__title {
        width: 5rem;
        height: 0.75rem;
      }

      .app-splash__item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 3rem;
        padding: 0.75rem;
        border-radius: 0.5rem;
        background-color: var(--splash-row);
      }

      .app-splash__name {
        width: 40%;
        height: 1rem;
      }

      .app-splash__item:nth-child(3) .app-splash__name {
        width: 60%;
      }

      .app-splash__item:nth-child(4) .app-splash__name {
        width: 30%;
      }

      .app-splash__qty {
        width: 2.5rem;
        height: 0.8125rem;
      }

      /*
        Progress card. Mirrors shell/boot-progress so the hand-off to the Angular card
        does not resize: the phase headline has no text to show yet (transloco is not
        loaded) but still reserves its line, and the counter sits where the Angular
        card's counter sits.
      */
      .app-splash__progress {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        pointer-events: none;
      }

      .app-splash__card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: min(20rem, 100%);
        box-sizing: border-box;
        padding: 1rem;
        border-radius: 1rem;
        background: var(--splash-card);
        box-shadow:
          0px 3px 5px -1px rgba(0, 0, 0, 0.2),
          0px 6px 10px 0px rgba(0, 0, 0, 0.14),
          0px 1px 18px 0px rgba(0, 0, 0, 0.12);
      }

      .app-splash__track {
        height: 0.25rem;
        border-radius: 999rem;
        background: var(--splash-track);
        overflow: hidden;
      }

      .app-splash__fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: var(--splash-accent);
      }

      @media (prefers-reduced-motion: no-preference) {
        .app-splash__fill {
          transition: width 0.32s cubic-bezier(0.2, 0, 0, 1);
        }
      }

      /* Empty, but holds the headline's line so the Angular card is the same height. */
      .app-splash__phase {
        margin: 0;
        min-height: 1.40625rem;
      }

      .app-splash__diagnostics {
        display: flex;
        justify-content: flex-end;
        margin: 0;
        font-size: 0.75rem;
        line-height: 1.4;
        color: var(--splash-muted);
        font-variant-numeric: tabular-nums;
      }

      @media (prefers-reduced-motion: no-preference) {
        .app-splash__icon,
        .app-splash__toggle,
        .app-splash__title,
        .app-splash__name,
        .app-splash__qty {
          animation: app-splash-pulse 1.5s ease-in-out infinite;
        }
      }

      @keyframes app-splash-pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.4;
        }
      }
    </style>

    <!--
      Apply an explicit dark/light override before first paint. ThemeService does the
      same thing (see core/theme/theme.service.ts) but only once Angular has bootstrapped,
      which would flash the wrong palette on the splash. Keep the storage key in sync
      with SETTINGS_STORAGE_KEY.
    -->
    <script>
      try {
        var darkMode = JSON.parse(localStorage.getItem('app-settings') || '{}').darkMode;
        if (darkMode === true) {
          document.documentElement.classList.add('theme-dark');
        } else if (darkMode === false) {
          document.documentElement.classList.add('theme-light');
        }
      } catch (e) {
        /* No stored preference — fall back to the OS setting. */
      }
    </script>
  </head>
  <body>
    <app-root aria-busy="true"></app-root>

    <div id="app-splash" class="app-splash" aria-hidden="true">
      <div class="app-splash__banner"></div>

      <div class="app-splash__top-bar">
        <div class="app-splash__icon"></div>
        <div class="app-splash__toggle"></div>
        <div class="app-splash__icon"></div>
      </div>

      <div class="app-splash__content">
        <div class="app-splash__group">
          <div class="app-splash__header"><div class="app-splash__title"></div></div>
          <div class="app-splash__item">
            <div class="app-splash__name"></div>
            <div class="app-splash__qty"></div>
          </div>
          <div class="app-splash__item">
            <div class="app-splash__name"></div>
            <div class="app-splash__qty"></div>
          </div>
          <div class="app-splash__item">
            <div class="app-splash__name"></div>
            <div class="app-splash__qty"></div>
          </div>
        </div>

        <div class="app-splash__group">
          <div class="app-splash__header"><div class="app-splash__title"></div></div>
          <div class="app-splash__item">
            <div class="app-splash__name"></div>
            <div class="app-splash__qty"></div>
          </div>
          <div class="app-splash__item">
            <div class="app-splash__name"></div>
            <div class="app-splash__qty"></div>
          </div>
        </div>
      </div>

      <div class="app-splash__progress">
        <div class="app-splash__card">
          <div class="app-splash__track">
            <div id="app-splash-fill" class="app-splash__fill"></div>
          </div>
          <p class="app-splash__phase"></p>
          <p class="app-splash__diagnostics">
            <span id="app-splash-counter"></span>
          </p>
        </div>
      </div>
    </div>

    <!--
      Pre-bootstrap half of the progress bar. Runs here, at the end of the body, so the
      splash DOM exists; `buffered: true` picks up resources that finished during parse.
      Hands the running tally to BootProgressService via window.__bootProgress, which
      continues the same counters rather than resetting them.
    -->
    <script>
      (function () {
        var fill = document.getElementById('app-splash-fill');
        var counter = document.getElementById('app-splash-counter');
        if (!fill) {
          return;
        }

        // The Angular half of the bar starts here — see PHASE_BASE in core/boot.
        var CEILING = 35;
        var state = { files: 0, bytes: 0 };
        window.__bootProgress = state;

        var numberFormat;
        try {
          numberFormat = new Intl.NumberFormat(navigator.language, {
            maximumFractionDigits: 1,
          });
        } catch (e) {
          numberFormat = new Intl.NumberFormat('en', { maximumFractionDigits: 1 });
        }

        function size(bytes) {
          if (bytes >= 1e6) {
            return numberFormat.format(bytes / 1e6) + ' MB';
          }
          if (bytes >= 1e3) {
            return numberFormat.format(bytes / 1e3) + ' kB';
          }
          return numberFormat.format(bytes) + ' B';
        }

        function render() {
          // No denominator is knowable before the app is parsed — the initial chunk
          // count is not in the HTML. So approach the ceiling on a decelerating curve
          // driven by real completions rather than inventing a fraction: the bar moves
          // when resources land and stalls when the network does.
          var percent = CEILING * (1 - Math.pow(0.9, state.files));
          fill.style.width = percent.toFixed(1) + '%';
          counter.textContent = state.files
            ? numberFormat.format(state.files) + ' · ' + size(state.bytes)
            : '';
        }

        if (typeof PerformanceObserver === 'undefined') {
          return;
        }

        var observer = new PerformanceObserver(function (list) {
          var entries = list.getEntries();
          for (var i = 0; i < entries.length; i++) {
            state.files += 1;
            state.bytes += entries[i].transferSize || entries[i].encodedBodySize || 0;
          }
          render();
        });

        state.stop = function () {
          observer.disconnect();
        };

        observer.observe({ type: 'resource', buffered: true });
      })();
    </script>
  </body>
</html>
